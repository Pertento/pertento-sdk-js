name: Release

# Publishes @pertentoai/sdk to npm when a v* tag is pushed, with npm trusted publishing
# (OIDC): no npm token is stored anywhere, and every release carries a provenance
# attestation linking it to this workflow run. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusted publishing exchanges for a publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No caches in the release job: nothing restored from an earlier run can reach the tarball.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
          no-cache: true
      # Node 24 bundles npm 11.x; trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: npm supports trusted publishing
        run: |
          npm --version
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error('npm ' + process.argv[1] + ' is older than 11.5.1'); process.exit(1); }
          " "$(npm --version)"

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run typecheck:consumer
      - run: node scripts/node-smoke.mjs

      - name: Publish
        run: npm publish --provenance --access public
